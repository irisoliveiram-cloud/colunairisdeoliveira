<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Iris de Oliveira</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#111;color:#eee;padding:1rem}
input,textarea,select{width:100%;background:#222;border:1px solid #444;color:#eee;padding:.6rem;margin-bottom:.8rem;font-size:.95rem;font-family:inherit}
label{font-size:.75rem;color:#aaa;display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
button{padding:.7rem 1.4rem;border:none;cursor:pointer;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.btn-pub{background:#a4221e;color:#fff}
.btn-pub:hover{background:#c0392b}
.btn-sec{background:#333;color:#ccc}
.status{margin-top:.8rem;font-size:.85rem;min-height:1.2rem}
.ok{color:#7dba7d}.erro{color:#e07070}.load{color:#aaa}
h1{font-size:1.1rem;margin-bottom:1.2rem;color:#fff}
.lista{margin-top:2rem}
.art{background:#1a1a1a;border:1px solid #333;padding:.7rem 1rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.art-info{flex:1;min-width:0}
.art-titulo{font-size:.9rem;cursor:pointer;color:#ddd}
.art-titulo:hover{color:#e07070}
.art-meta{font-size:.7rem;color:#666;margin-top:.15rem}
.art-btns{display:flex;gap:.4rem;flex-shrink:0}
.btn-sm{padding:.3rem .6rem;font-size:.7rem}
#tela-login{max-width:320px;margin:4rem auto}
#tela-admin{display:none;max-width:860px;margin:0 auto}
</style>
</head>
<body>

<div id="tela-login">
  <h1>Admin — Iris de Oliveira</h1>
  <label>Senha</label>
  <input type="password" id="senha" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn-pub" onclick="entrar()">Entrar</button>
  <div class="status" id="st-login"></div>
</div>

<div id="tela-admin">
  <h1 id="h-titulo">Novo artigo</h1>

  <label>Título</label>
  <input type="text" id="f-titulo">

  <label>Lead (subtítulo em itálico)</label>
  <textarea id="f-lead" rows="3"></textarea>

  <div class="row">
    <div>
      <label>Editoria (tag)</label>
      <input type="text" id="f-tag" list="tags">
      <datalist id="tags">
        <option value="COLUNA | POLÍTICA & PODER">
        <option value="COLUNA | ECONOMIA & SOCIEDADE">
        <option value="COLUNA | CULTURA & SOCIEDADE">
        <option value="COLUNA | SEGURANÇA PÚBLICA & GEOPOLÍTICA">
        <option value="COLUNA | SAÚDE & POLÍTICAS PÚBLICAS">
        <option value="COLUNA | TRABALHO & POLÍTICA">
        <option value="COLUNA | EDUCAÇÃO & SOCIEDADE">
        <option value="COLUNA | ECONOMIA & GEOPOLÍTICA">
        <option value="COLUNA | POLÍTICA & INSTITUIÇÕES">
        <option value="COLUNA | POLÍTICAS PÚBLICAS & SOCIEDADE">
        <option value="COLUNA | MERCADO DE TRABALHO & DEMOGRAFIA">
      </datalist>
    </div>
    <div>
      <label>Data de exibição</label>
      <input type="text" id="f-date">
    </div>
  </div>

  <label>Imagem de capa (URL imgur)</label>
  <input type="text" id="f-img" placeholder="https://i.imgur.com/XXXXX.png">

  <label>Corpo do artigo — cole o HTML do Word aqui (não modifica nada)</label>
  <textarea id="f-body" rows="14" placeholder="Cole aqui o texto copiado do Word ou o HTML direto..."></textarea>

  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem">
    <button class="btn-pub" onclick="salvar()" id="btn-salvar">✓ Publicar</button>
    <button class="btn-sec" onclick="novoArtigo()">+ Novo</button>
    <button class="btn-sec" onclick="voltarLista()">← Lista</button>
    <button class="btn-sec" style="background:#3a1a1a;color:#e07070" id="btn-del" onclick="excluir()" style="display:none">Excluir</button>
  </div>
  <div class="status" id="st-editor"></div>

  <div class="lista">
    <div style="font-size:.75rem;color:#666;margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.08em">Artigos publicados</div>
    <div id="lista-artigos">Carregando...</div>
  </div>
</div>

<script>
var U='https://bnrewcmjuvpnowdaxjpt.supabase.co';
var K='sb_publishable_NgWXnZWJNbCRcd7uKugCkw_-dv55FjZ';
var idAtual=null;

function entrar(){
  var s=document.getElementById('senha').value;
  if(s==='iris2026'){
    sessionStorage.setItem('ok','1');
    document.getElementById('tela-login').style.display='none';
    document.getElementById('tela-admin').style.display='block';
    carregarLista();
    // Data padrão
    var d=new Date();
    var m=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
    document.getElementById('f-date').value=d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear();
  } else {
    document.getElementById('st-login').textContent='Senha incorreta.';
    document.getElementById('st-login').className='status erro';
  }
}

window.onload=function(){
  if(sessionStorage.getItem('ok')==='1'){
    document.getElementById('tela-login').style.display='none';
    document.getElementById('tela-admin').style.display='block';
    carregarLista();
    var d=new Date();
    var m=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
    document.getElementById('f-date').value=d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear();
  }
  document.getElementById('senha').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});
};

function api(met,path,corpo){
  return fetch(U+'/rest/v1/'+path,{
    method:met,
    headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json','Prefer':'return=representation'},
    body:corpo?JSON.stringify(corpo):undefined
  }).then(function(r){return r.json();});
}

function carregarLista(){
  api('GET','artigos?select=id,tag,title,date&order=created_at.desc').then(function(data){
    var html=data.map(function(a){
      return '<div class="art">'+
        '<div class="art-info">'+
          '<div class="art-titulo" onclick="editar('+a.id+')">'+esc(a.title||'Sem título')+'</div>'+
          '<div class="art-meta">'+esc(a.tag||'')+(a.date?' · '+esc(a.date):'')+'</div>'+
        '</div>'+
        '<div class="art-btns">'+
          '<button class="btn-sec btn-sm" onclick="editar('+a.id+')">Editar</button>'+
        '</div>'+
      '</div>';
    }).join('');
    document.getElementById('lista-artigos').innerHTML=html||'Nenhum artigo.';
  });
}

function editar(id){
  api('GET','artigos?id=eq.'+id+'&select=*').then(function(data){
    var a=data[0];
    idAtual=a.id;
    document.getElementById('h-titulo').textContent='Editando artigo #'+a.id;
    document.getElementById('f-titulo').value=a.title||'';
    document.getElementById('f-tag').value=a.tag||'';
    document.getElementById('f-date').value=a.date||'';
    document.getElementById('f-img').value=a.imagem_url||'';
    document.getElementById('f-lead').value=a.excerpt||'';
    document.getElementById('f-body').value=a.body||'';
    document.getElementById('btn-salvar').textContent='✓ Salvar alterações';
    document.getElementById('btn-del').style.display='';
    window.scrollTo(0,0);
    st('','');
  });
}

function novoArtigo(){
  idAtual=null;
  document.getElementById('h-titulo').textContent='Novo artigo';
  document.getElementById('f-titulo').value='';
  document.getElementById('f-tag').value='';
  document.getElementById('f-lead').value='';
  document.getElementById('f-img').value='';
  document.getElementById('f-body').value='';
  document.getElementById('btn-salvar').textContent='✓ Publicar';
  document.getElementById('btn-del').style.display='none';
  var d=new Date();
  var m=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
  document.getElementById('f-date').value=d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear();
  window.scrollTo(0,0);
  st('','');
}

function voltarLista(){
  window.scrollTo(0,document.getElementById('lista-artigos').offsetTop-20);
}

function salvar(){
  var titulo=document.getElementById('f-titulo').value.trim();
  var body=document.getElementById('f-body').value.trim();
  if(!titulo){st('Preencha o título.','erro');return;}
  if(!body){st('O corpo do artigo está vazio.','erro');return;}

  var payload={
    title:titulo,
    tag:document.getElementById('f-tag').value.trim(),
    date:document.getElementById('f-date').value.trim(),
    imagem_url:document.getElementById('f-img').value.trim()||null,
    excerpt:document.getElementById('f-lead').value.trim(),
    body:body
  };

  st('Salvando...','load');
  document.getElementById('btn-salvar').disabled=true;

  var p=idAtual
    ?api('PATCH','artigos?id=eq.'+idAtual,payload)
    :api('POST','artigos',payload);

  p.then(function(data){
    st(idAtual?'Salvo!':'Publicado!','ok');
    document.getElementById('btn-salvar').disabled=false;
    if(!idAtual&&data&&data[0]){
      idAtual=data[0].id;
      document.getElementById('h-titulo').textContent='Editando artigo #'+idAtual;
      document.getElementById('btn-salvar').textContent='✓ Salvar alterações';
      document.getElementById('btn-del').style.display='';
    }
    carregarLista();
  }).catch(function(e){
    st('Erro: '+e.message,'erro');
    document.getElementById('btn-salvar').disabled=false;
  });
}

function excluir(){
  if(!idAtual)return;
  if(!confirm('Excluir este artigo? Não pode ser desfeito.'))return;
  api('DELETE','artigos?id=eq.'+idAtual).then(function(){
    st('Excluído.','ok');
    novoArtigo();
    carregarLista();
    idAtual=null;
  });
}

function st(msg,tipo){
  var el=document.getElementById('st-editor');
  el.textContent=msg;
  el.className='status'+(tipo?' '+tipo:'');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
