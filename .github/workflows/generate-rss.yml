name: Gerar RSS Feed

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar feed.xml
        run: |
          node -e "
          const https = require('https');

          const SUPABASE_URL = 'https://bnrewcmjuvpnowdaxjpt.supabase.co';
          const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJucmV3Y21qdXZwbm93ZGF4anB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MzMwMDMsImV4cCI6MjA5MDMwOTAwM30.YV5XTane49QcAc_iGqOdjc0CD33qDVu_XOLctgcVcnQ';
          const SITE_URL = 'https://colunairisdeoliveira.com.br';

          const path = '/rest/v1/artigos?select=id,tag,title,excerpt,created_at&order=created_at.desc&limit=20';

          const options = {
            hostname: 'bnrewcmjuvpnowdaxjpt.supabase.co',
            path: path,
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY
            }
          };

          https.get(options, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              const articles = JSON.parse(data);

              const items = articles.map(a => {
                const pub = new Date(a.created_at).toUTCString();
                const link = SITE_URL + '/#artigo-' + a.id;
                return [
                  '    <item>',
                  '      <title><![CDATA[' + (a.title || '') + ']]></title>',
                  '      <link>' + link + '</link>',
                  '      <guid>' + link + '</guid>',
                  '      <description><![CDATA[' + (a.excerpt || '') + ']]></description>',
                  '      <category><![CDATA[' + (a.tag || '') + ']]></category>',
                  '      <pubDate>' + pub + '</pubDate>',
                  '    </item>'
                ].join('\n');
              }).join('\n');

              const xml = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n' +
                '<rss version=\"2.0\" xmlns:atom=\"http://www.w3.org/2005/Atom\">\n' +
                '  <channel>\n' +
                '    <title>Iris de Oliveira | Análise e Opinião</title>\n' +
                '    <link>' + SITE_URL + '</link>\n' +
                '    <description>Coluna de análise e opinião sobre política, economia, segurança, sociedade e saúde. Por Iris de Oliveira.</description>\n' +
                '    <language>pt-BR</language>\n' +
                '    <atom:link href=\"' + SITE_URL + '/feed.xml\" rel=\"self\" type=\"application/rss+xml\" />\n' +
                items + '\n' +
                '  </channel>\n' +
                '</rss>';

              require('fs').writeFileSync('feed.xml', xml, 'utf8');
              console.log('feed.xml gerado com ' + articles.length + ' artigos.');
            });
          }).on('error', (e) => {
            console.error('Erro:', e.message);
            process.exit(1);
          });
          "

      - name: Commit e push do feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "chore: atualizar feed RSS"
          git push
