name: Gerar RSS Feed

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar feed.xml
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          const SUPABASE_URL = 'bnrewcmjuvpnowdaxjpt.supabase.co';
          const SUPABASE_KEY = 'sb_publishable_NgWXnZWJNbCRcd7uKugCkw_-dv55FjZ';
          const SITE_URL = 'https://colunairisdeoliveira.com.br';

          const options = {
            hostname: SUPABASE_URL,
            path: '/rest/v1/artigos?select=id,tag,title,excerpt,created_at&order=created_at.desc&limit=20',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY
            }
          };

          https.get(options, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              console.log('Status:', res.statusCode);
              console.log('Resposta raw:', data.substring(0, 300));

              let articles;
              try {
                articles = JSON.parse(data);
              } catch(e) {
                console.error('Erro ao parsear JSON:', e.message);
                process.exit(1);
              }

              if (!Array.isArray(articles)) {
                console.error('Resposta nao e array:', JSON.stringify(articles));
                process.exit(1);
              }

              console.log('Artigos encontrados:', articles.length);

              const items = articles.map(a => {
                const pub = new Date(a.created_at).toUTCString();
                const link = SITE_URL + '/#artigo-' + a.id;
                return [
                  '    <item>',
                  '      <title><![CDATA[' + (a.title || '') + ']]></title>',
                  '      <link>' + link + '</link>',
                  '      <guid>' + link + '</guid>',
                  '      <description><![CDATA[' + (a.excerpt || '') + ']]></description>',
                  '      <category><![CDATA[' + (a.tag || '') + ']]></category>',
                  '      <pubDate>' + pub + '</pubDate>',
                  '    </item>'
                ].join('\n');
              }).join('\n');

              const xml = [
                '<?xml version="1.0" encoding="UTF-8"?>',
                '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">',
                '  <channel>',
                '    <title>Iris de Oliveira | Análise e Opinião</title>',
                '    <link>' + SITE_URL + '</link>',
                '    <description>Coluna de análise e opinião sobre política, economia, segurança, sociedade e saúde.</description>',
                '    <language>pt-BR</language>',
                '    <atom:link href="' + SITE_URL + '/feed.xml" rel="self" type="application/rss+xml" />',
                items,
                '  </channel>',
                '</rss>'
              ].join('\n');

              fs.writeFileSync('feed.xml', xml, 'utf8');
              console.log('feed.xml gerado com sucesso!');
            });
          }).on('error', (e) => {
            console.error('Erro de rede:', e.message);
            process.exit(1);
          });
          EOF

      - name: Commit e push do feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "chore: atualizar feed RSS"
          git push
