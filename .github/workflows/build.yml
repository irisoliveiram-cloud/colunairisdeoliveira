name: Build e deploy do site

# Quando este workflow roda:
#   - Toda vez que voce faz um commit no branch main
#   - Diariamente as 06:00 UTC (03:00 horario de Brasilia)
#     -- isso pega artigos novos publicados via Supabase Studio
#   - Manualmente pelo botao "Run workflow" na aba Actions
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Permissoes necessarias para o GitHub Actions atualizar o repositorio
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Rodar pre-renderizacao
        run: npm run build

      - name: Commitar arquivos gerados (se houver mudancas)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artigo/ sitemap.xml robots.txt index.html
          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
          else
            git commit -m "build: atualizar paginas pre-renderizadas [skip ci]"
            git push
          fi
